name: Release menu bar app

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release-menubar
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    # Holds the signing secrets. A required reviewer makes every run wait for approval.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # v7.0.1, pinned by SHA because this job holds the signing key.
      # No saved token, so bun install and the build cannot push. The publish step logs git in itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # v2.2.0, pinned by SHA like checkout. Bun compiles the collector that ships inside the app.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute next version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST="$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          # A failed run can leave a tag on this commit with no release. Finish that one instead of skipping it.
          if [[ -n "$LATEST" && "$(git rev-parse "$LATEST^{commit}")" == "$(git rev-parse HEAD)" ]] && ! gh release view "$LATEST" > /dev/null 2>&1; then
            echo "Resuming unreleased tag $LATEST"
            echo "APP_VERSION=${LATEST#v}" >> "$GITHUB_ENV"
            exit 0
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          MAJOR="${MAJOR:-0}" MINOR="${MINOR:-0}" PATCH="${PATCH:-0}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Latest tag: ${LATEST:-none}, next version: $VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials cpa-notary \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$NOTARY_KEYCHAIN"

      - name: Build, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: "1"
        # release.sh pushes the tag. The gh credential helper only has a token in steps that set GH_TOKEN.
        run: |
          gh auth setup-git
          apps/menubar/scripts/release.sh

      - name: Record the released version
        id: version
        run: echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # A separate job, so a failed bump can be rerun alone without cutting a new version.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Update the cask in kolezka/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          # Write deploy key on kolezka/homebrew-tap, so this secret can touch only that repo.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$VERSION" || -z "$TAP_DEPLOY_KEY" ]]; then
            echo "Missing the release version or the HOMEBREW_TAP_DEPLOY_KEY secret." >&2
            exit 1
          fi
          # Hash the file users download, not a local build.
          DMG="ClaudeTelemetry-$VERSION.dmg"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$DMG" --dir "$RUNNER_TEMP"
          SHA="$(sha256sum "$RUNNER_TEMP/$DMG" | cut -d' ' -f1)"

          KEY="$RUNNER_TEMP/tap-deploy-key"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY")
          # GitHub's host keys come from its API over HTTPS, so SSH does not trust on first use.
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"

          TAP="$RUNNER_TEMP/tap"
          git clone --depth 1 git@github.com:kolezka/homebrew-tap.git "$TAP"
          CASK="$TAP/Casks/claude-telemetry.rb"
          sed -i -E "s/^  version \"[^\"]*\"$/  version \"$VERSION\"/; s/^  sha256 \"[0-9a-f]{64}\"$/  sha256 \"$SHA\"/" "$CASK"
          # A sed that matches nothing exits 0, so check that both lines now hold the new values.
          grep -qxF "  version \"$VERSION\"" "$CASK"
          grep -qxF "  sha256 \"$SHA\"" "$CASK"
          if git -C "$TAP" diff --quiet; then
            echo "Cask already at $VERSION."
            exit 0
          fi
          git -C "$TAP" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "claude-telemetry $VERSION"
          git -C "$TAP" push origin HEAD:main
